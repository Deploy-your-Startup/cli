name: CI

# Run the same lint and test contracts locally and in CI on pushes and PRs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # One entrypoint, so CI and a local `./make.sh lint` can never drift
      # apart. What it runs (ruff + ty here) is the service's business — the
      # pipeline only knows the verb, which is what keeps it language-agnostic.
      # ruff and ty are both pinned in pyproject.toml, so the rule set is fixed.
      - name: Lint
        run: ./make.sh lint
        env:
          # Renders ruff findings as inline PR annotations without make.sh
          # needing to know it is running inside GitHub Actions.
          RUFF_OUTPUT_FORMAT: github

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Deploy-your-Startup/deploy-template
          ref: v0.1.6
          path: .test-deploy-template
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Require SSH access E2E prerequisites
        run: |
          command -v kubectl
          docker info >/dev/null
      # Domain-order integration tests drive a real headless browser against
      # a local KonsoleH stand-in.
      - name: Install headless browser
        run: uv run --extra dev playwright install --with-deps chromium-headless-shell
      - name: Run tests
        run: ./make.sh test
        env:
          STARTUP_TEST_DEPLOY_TEMPLATE: ${{ github.workspace }}/.test-deploy-template
