name: Agent instruction links
on:
  pull_request:
    paths: ['**/AGENTS.md', '**/*.md', 'tests/test_agent_links_integration.py', '.github/workflows/testing-policy.yml']
  push:
    branches: [main]
    paths: ['**/AGENTS.md', '**/*.md', 'tests/test_agent_links_integration.py', '.github/workflows/testing-policy.yml']
permissions:
  contents: read
jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Follow every relative link in the agent instructions
        run: python3 tests/test_agent_links_integration.py
