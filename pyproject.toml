[build-system]
requires = ["setuptools>=83.0.0", "setuptools-scm>=10.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-your-startup-cli"
dynamic = ["version"]
description = "CLI tool for Deploy Your Startup operations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Deploy Your Startup", email = "contact@deployyourstartup.com"}
]
dependencies = [
    "copier==9.19.1",
    "ansible==14.5.0",
    "click>=8.4.2",
    # Runtime requirement of the hetzner.hcloud Ansible collection (the deploy
    # playbooks import it); not imported by the CLI code directly.
    "hcloud==2.27.0",
    "httpx>=0.28.1",
    # Browser automation for `startup bootstrap` / `startup hetzner` (Cloudflare +
    # Hetzner console). Kept as a core dep so a direct CLI install has the FULL
    # feature set. Project deployments don't run the browser flows, so they prune
    # it via `[tool.uv] override-dependencies` (see a deployment pyproject) —
    # playwright bundles a ~130 MB node driver we don't want in CI pipelines.
    "playwright>=1.61.0",
    "pyyaml>=6.0.3",
    "keyring>=25.6.0",
    "tldextract>=5.3,<6",
    "playwright-stealth==2.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    # Pinned to a minor series on purpose: `ruff>=` plus `uvx ruff` meant every
    # developer and CI run could pick up a different ruff whose default rule set
    # had grown. Bump this deliberately, then run `./make.sh format`.
    "pytest-xdist==3.8.0",
    "ruff>=0.16.0,<0.18",
    # Exact pin, not a range: ty is 0.0.x and explicitly has no stable API —
    # diagnostics can change between any two releases. Since `./make.sh lint`
    # gates CI, an unpinned bump would turn every pipeline red at once. Bump
    # deliberately, then run `./make.sh lint`.
    "ty==0.0.90",
]
server = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
]

[project.urls]
"Homepage" = "https://github.com/Deploy-your-Startup/cli"
"Bug Tracker" = "https://github.com/Deploy-your-Startup/cli/issues"

[project.scripts]
startup = "cli.startup:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cli*"]

# The agent skill ships inside the package so `startup skills install` works
# without a checkout. Its public copy for skill installers lives in skills/.
[tool.setuptools.package-data]
cli = ["agent_skills/*/SKILL.md"]

# Version is derived from the latest git tag (e.g. v0.5.0 -> 0.5.0) at build
# time. The installer uses fixed `vX.Y.Z` tags; PyPI publishing is manual.
[tool.setuptools_scm]

[tool.pytest.ini_options]
pythonpath = ["src"]

# Lint rules are selected explicitly. Ruff's *default* rule set grows with new
# releases, so relying on it means a routine `ruff` upgrade can flood the repo
# with errors nobody introduced (this is exactly what happened with 0.16).
# Pin the set here and widen it deliberately.
[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # bugbear
    "C4",    # comprehensions
    "SIM",   # simplify
    "DTZ",   # timezone-naive datetimes
    "BLE",   # blind except
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
    "RUF",   # ruff-specific
    "C90",   # mccabe: complex functions
    "PLR0911", "PLR0912", "PLR0915",  # too many returns, branches, statements
]
ignore = [
    "E501",    # line length is the formatter's job; it cannot split long
               # comments/strings and we do not want them mangled
    "RUF001",  # ambiguous unicode: UI strings use typographic characters such as – — ×
]

# Functions that predate the size rules. Split them when you work on them and
# delete their entry; do not add new ones.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C901", "PLR0911", "PLR0912", "PLR0915"]
"scripts/check_factory_onboarding_e2e.py" = ["PLR0915"]
"src/cli/bootstrap.py" = ["PLR0915"]
"src/cli/cloudflare.py" = ["C901"]
"src/cli/cluster_commands.py" = ["C901"]
"src/cli/hetzner/__init__.py" = ["PLR0912"]
"src/cli/hetzner/automation.py" = ["C901"]
"src/cli/hetzner/domain_check.py" = ["C901", "PLR0912", "PLR0915"]
"src/cli/kube_access.py" = ["C901", "PLR0912"]
"src/cli/preflight.py" = ["C901"]
"src/cli/rotate_vault.py" = ["C901", "PLR0912", "PLR0915"]
"src/cli/template_commands.py" = ["C901"]
"src/cli/verification.py" = ["C901", "PLR0912", "PLR0915"]
"src/cli/wizard/runner.py" = ["C901", "PLR0912"]
"src/cli/wizard/steps/cost.py" = ["C901", "PLR0912", "PLR0915"]
"src/cli/wizard/steps/finalize.py" = ["C901", "PLR0912", "PLR0915"]
"src/cli/wizard/steps/project.py" = ["C901", "PLR0912", "PLR0915"]
