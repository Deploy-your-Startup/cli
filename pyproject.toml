[build-system]
requires = ["setuptools>=84.0.0", "setuptools-scm>=10.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-your-startup-cli"
dynamic = ["version"]
description = "CLI tool for Deploy Your Startup operations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Deploy Your Startup", email = "contact@deployyourstartup.com"}
]
dependencies = [
    "ansible==14.3.0",
    "click>=8.4.2",
    # Runtime requirement of the hetzner.hcloud Ansible collection (the deploy
    # playbooks import it); not imported by the CLI code directly.
    "hcloud==2.23.0",
    "httpx>=0.28.1",
    # Browser automation for `startup bootstrap` / `startup hetzner` (Cloudflare +
    # Hetzner console). Kept as a core dep so a direct CLI install has the FULL
    # feature set. Project deployments don't run the browser flows, so they prune
    # it via `[tool.uv] override-dependencies` (see a deployment pyproject) —
    # playwright bundles a ~130 MB node driver we don't want in CI pipelines.
    "playwright>=1.62.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    # Pinned to a minor series on purpose: `ruff>=` plus `uvx ruff` meant every
    # developer and CI run could pick up a different ruff whose default rule set
    # had grown. Bump this deliberately, then run `./make.sh format`.
    "ruff>=0.16.2,<0.17",
]
server = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.2",
]

[project.urls]
"Homepage" = "https://github.com/Deploy-your-Startup/cli"
"Bug Tracker" = "https://github.com/Deploy-your-Startup/cli/issues"

[project.scripts]
startup = "cli.startup:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cli*"]

# Version is derived from the latest git tag (e.g. v0.5.0 -> 0.5.0) at build
# time. Tag a release with `vX.Y.Z` and the publish workflow ships that version.
[tool.setuptools_scm]

[tool.pytest.ini_options]
pythonpath = ["src"]

# Lint rules are selected explicitly. Ruff's *default* rule set grows with new
# releases, so relying on it means a routine `ruff` upgrade can flood the repo
# with errors nobody introduced (this is exactly what happened with 0.16).
# Pin the set here and widen it deliberately.
[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # bugbear
    "C4",    # comprehensions
    "SIM",   # simplify
    "DTZ",   # timezone-naive datetimes
    "BLE",   # blind except
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
    "RUF",   # ruff-specific
]
ignore = [
    "E501",    # line length is the formatter's job; it cannot split long
               # comments/strings and we do not want them mangled
    "RUF001",  # ambiguous unicode: the UI strings are German and use – — ×
]
